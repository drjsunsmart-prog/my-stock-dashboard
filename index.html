<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주식시장 심리 지표 대시보드 (자동 업데이트)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14; --bg2: #13161e; --bg3: #1a1e28;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
    --text: #e8eaf0; --text2: #8a8fa8; --text3: #4a4f66;
    --red: #e05252; --amber: #d4924a; --green: #4fad7f;
    --blue: #4a90d9; --accent: #6c8ef0;
    --mono: 'IBM Plex Mono', monospace; --sans: 'IBM Plex Sans KR', sans-serif;
    --radius: 6px; --radius-lg: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); padding: 2rem; line-height: 1.6; }
  .header { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 0.5px solid var(--border2); padding-bottom: 1.25rem; margin-bottom: 2rem; }
  .btn-update { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: var(--radius); cursor: pointer; font-size: 13px; }
  .section-label { font-size: 10px; font-weight: 500; color: var(--text3); text-transform: uppercase; font-family: var(--mono); margin-bottom: 10px; }
  .metric-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 1.75rem; }
  .metric-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; }
  .metric-value { font-size: 24px; font-family: var(--mono); margin: 4px 0; transition: color 0.3s; }
  .two-col { display: grid; grid-template-columns: 1fr 1.6fr; gap: 12px; margin-bottom: 12px; }
  .panel { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; }
  .ind-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; cursor: pointer; padding: 4px; border-radius: 4px; }
  .ind-row:hover { background: var(--bg3); }
  .ind-name { font-size: 12px; font-family: var(--mono); color: var(--text2); width: 120px; }
  .bar-track { flex: 1; height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; transition: width 0.8s ease; }
  .ind-desc-panel { display: none; background: #1e2330; border-left: 2px solid var(--accent); padding: 10px; margin: 5px 0 12px 120px; font-size: 11px; color: var(--text2); }
  .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .chart-wrap { height: 200px; }
  @media (max-width: 900px) { .metric-grid, .two-col, .chart-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1 style="font-size:20px;">주식시장 심리 지표 대시보드</h1>
    <div id="status-msg" style="font-size:11px; color:var(--text3); font-family:var(--mono);">페이지를 여는 중...</div>
  </div>
  <button class="btn-update" onclick="updateData()">수동 업데이트</button>
</div>

<div class="metric-grid">
  <div class="metric-card"><div class="section-label">공포·탐욕 지수</div><div class="metric-value" id="val-fg">--</div><div id="sub-fg" style="font-size:11px; color:var(--text3);">산출 중...</div></div>
  <div class="metric-card"><div class="section-label">VIX 변동성</div><div class="metric-value" id="val-vix">--</div><div id="sub-vix" style="font-size:11px; color:var(--text3);">실시간 데이터</div></div>
  <div class="metric-card"><div class="section-label">S&P 500</div><div class="metric-value" id="val-sp">--</div><div id="sub-sp" style="font-size:11px; color:var(--text3);">전일 대비</div></div>
  <div class="metric-card"><div class="section-label">풋/콜 비율</div><div class="metric-value" style="color:var(--red)">1.21</div><div style="font-size:11px; color:var(--text3);">시장 심리 하락</div></div>
  <div class="metric-card"><div class="section-label">안전자산 수요</div><div class="metric-value" style="color:var(--green)">강함</div><div style="font-size:11px; color:var(--text3);">국채 선호</div></div>
</div>

<div class="two-col">
  <div class="panel" style="text-align:center;">
    <div class="section-label">공포·탐욕 게이지</div>
    <canvas id="gaugeCanvas" width="240" height="130" style="margin-top:20px;"></canvas>
    <div id="gaugeScore" style="font-size:40px; font-family:var(--mono); margin-top:-10px;">--</div>
  </div>
  <div class="panel">
    <div class="section-label">7대 세부 심리 지표 (클릭 시 설명)</div>
    <div id="indicatorList"></div>
  </div>
</div>

<div class="chart-row">
  <div class="panel"><div class="section-label">공포·탐욕 지수 추이 (최근)</div><div class="chart-wrap"><canvas id="fgChart"></canvas></div></div>
  <div class="panel"><div class="section-label">VIX 변동성 추이</div><div class="chart-wrap"><canvas id="vixChart"></canvas></div></div>
</div>

<script>
// 지표 정보
const indicatorDetails = {
  '시장 모멘텀': 'S&P 500 지수와 장기 평균을 비교합니다.',
  '주가 강도': '신고가와 신저가 종목 비율을 분석합니다.',
  '주가 폭': '상승/하락 종목의 거래량 합계를 비교합니다.',
  '풋/콜 비율': '옵션 시장의 하락 베팅 강도를 측정합니다.',
  '정크본드 수요': '위험 채권에 대한 투자자 선호도를 봅니다.',
  '안전자산 수요': '주식 대비 국채의 상대적 수익률을 봅니다.',
  'VIX (변동성)': '시장 참여자들이 예상하는 미래의 변동성입니다.'
};

const indicators = [
  { name: '시장 모멘텀', value: 35, color: '#c84040' },
  { name: '주가 강도',   value: 28, color: '#c84040' },
  { name: '주가 폭',     value: 45, color: '#d4924a' },
  { name: '풋/콜 비율',  value: 30, color: '#c84040' },
  { name: '정크본드 수요',value: 52, color: '#4a4f66' },
  { name: '안전자산 수요',value: 70, color: '#4fad7f' },
  { name: 'VIX (변동성)',value: 32, color: '#c84040' }
];

// 초기 리스트 생성
const indCont = document.getElementById('indicatorList');
indicators.forEach(ind => {
  const wrapper = document.createElement('div');
  wrapper.innerHTML = `
    <div class="ind-row" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'block' ? 'none' : 'block'">
      <span class="ind-name">${ind.name}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${ind.value}%; background:${ind.color};"></div></div>
      <span style="font-family:var(--mono); width:30px; text-align:right; font-size:12px;">${ind.value}</span>
    </div>
    <div class="ind-desc-panel">${indicatorDetails[ind.name]}</div>
  `;
  indCont.appendChild(wrapper);
});

function getZone(v) {
  if (v < 25) return { label: '극단적 공포', color: '#8b2020' };
  if (v < 45) return { label: '공포', color: '#e05252' };
  if (v < 55) return { label: '중립', color: '#8a8fa8' };
  if (v < 75) return { label: '탐욕', color: '#4fad7f' };
  return { label: '극단적 탐욕', color: '#1e5c3e' };
}

// 게이지 그리기
function drawGauge(score) {
  const canvas = document.getElementById('gaugeCanvas');
  const ctx = canvas.getContext('2d');
  const cx = 120, cy = 120, r = 100;
  ctx.clearRect(0,0,240,130);
  
  // 배경 원호
  ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, 2*Math.PI);
  ctx.lineWidth = 15; ctx.strokeStyle = '#1a1e28'; ctx.stroke();
  
  // 스코어 원호
  const angle = Math.PI + (score/100) * Math.PI;
  ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, angle);
  ctx.strokeStyle = getZone(score).color; ctx.stroke();
  
  document.getElementById('gaugeScore').textContent = score;
  document.getElementById('gaugeScore').style.color = getZone(score).color;
}

// 실시간 데이터 가져오기
async function updateData() {
  document.getElementById('status-msg').textContent = '데이터 업데이트 중...';
  try {
    const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/^VIX?range=5d&interval=1d`);
    const data = await res.json();
    const latestVix = data.chart.result[0].indicators.quote[0].close.slice(-1)[0];
    
    // VIX 기반 공포지수 계산 (VIX 15 이하=탐욕, 30 이상=공포)
    const fgScore = Math.max(5, Math.min(95, Math.round(100 - (latestVix * 2.5))));
    const zone = getZone(fgScore);

    // 화면 반영
    document.getElementById('val-vix').textContent = latestVix.toFixed(2);
    document.getElementById('val-vix').style.color = latestVix > 25 ? 'var(--red)' : 'var(--green)';
    
    document.getElementById('val-fg').textContent = fgScore;
    document.getElementById('val-fg').style.color = zone.color;
    document.getElementById('sub-fg').textContent = zone.label + ' 구간';
    
    drawGauge(fgScore);
    document.getElementById('status-msg').textContent = '최신 데이터 동기화 완료: ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('status-msg').textContent = '업데이트 실패 (CORS 제한/네트워크)';
    drawGauge(28); // 실패 시 기본값
  }
}

// 페이지 열리자마자 자동 실행
window.onload = () => {
  updateData();
};
</script>
</body>
</html>
